<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle soft shadow to give depth against any background -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <!-- Brand Orange Gradient -->
    <linearGradient id="brand-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B38" />
      <stop offset="100%" stop-color="#FF5520" />
    </linearGradient>
  </defs>

  <!-- SOLID PURE WHITE ICON BACKGROUND WITH REFINED SQUIRCLE EDGES -->
  <rect width="512" height="512" rx="120" fill="#FFFFFF" />
  
  <!-- Subtle border to define edges against pure white backgrounds -->
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="#EAEAEA" stroke-width="4" />

  <!-- BRENTIQ BRAND MARK "B" EMBLEM -->
  <g transform="translate(106, 96)">
    <!-- Vertical Spine Pillar of B -->
    <rect x="0" y="0" width="68" height="320" rx="34" fill="#0A0A0C" />

    <!-- Top Loop Segment -->
    <path 
      d="M 50 0 L 170 0 C 230 0 270 36 270 92 C 270 148 230 180 170 180 L 50 180 Z" 
      fill="#0A0A0C" 
    />
    <!-- Top Counter cutout (reveals white background) -->
    <path 
      d="M 68 50 L 160 50 C 192 50 212 68 212 92 C 212 116 192 134 160 134 L 68 134 Z" 
      fill="#FFFFFF" 
    />

    <!-- Bottom Loop Segment with Signature Brentiq Orange Accent -->
    <path 
      d="M 50 144 L 190 144 C 255 144 300 182 300 236 C 300 292 255 320 190 320 L 50 320 Z" 
      fill="url(#brand-orange)" 
    />
    <!-- Bottom Counter cutout (reveals white background) -->
    <path 
      d="M 68 192 L 180 192 C 215 192 238 210 238 234 C 238 258 215 272 180 272 L 68 272 Z" 
      fill="#FFFFFF" 
    />

    <!-- Dynamic Center Energy Dot / Notch in Orange -->
    <circle cx="168" cy="92" r="22" fill="#FF5520" />
  </g>
</svg>

